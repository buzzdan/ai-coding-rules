# The Go binding: every scalar a core template substitutes as {{.Name}}, plus
# the output paths the generator does not own. Field names are the yaml keys
# of Vars in tools/ldd-gen.
plugin: go-linter-driven-development
lang: Go
cmd_prefix: go-ldd
src_glob: "*.go"
test_glob: "_test.go"
project_marker: go.mod
nolint: "//nolint"
comment_prefix: "//"
default_test: go test ./...
default_lint: golangci-lint run
default_lint_fix: golangci-lint run --fix
# Paths in the plugin directory the generator does not own. A pattern with a
# slash matches a path or one of its parent directories; a pattern without a
# slash matches a file or directory name anywhere, in the plugin directory and
# in the sources alike. An eval run copies its cases under evals/ at run time;
# the pointer README there is copied through from passthrough/evals/README.md
# and is still checked.
ignore:
  - evals/*
  - .DS_Store
