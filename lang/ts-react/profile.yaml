# The TypeScript + React binding: every scalar a core template substitutes as
# {{.Name}}, plus the output paths the generator does not own. Field names are the
# yaml keys of Vars in tools/ldd-gen. The binding is one language (TypeScript) and
# one framework (React): the scalars are TypeScript's, the includes are written for
# a React repository. The positions it takes where the rules' Go text meets a
# TypeScript or React idiom are recorded in docs/language-residue.md, "The ts-react
# binding".
plugin: ts-react-linter-driven-development
lang: TypeScript + React
cmd_prefix: tsr-ldd
# Core uses the source glob in `grep --include` and `git diff -- '<glob>'`, one glob
# per binding, so it has to cover both `.ts` and `.tsx` in one pattern; the includes'
# own detection commands spell both and prune node_modules.
src_glob: "*.ts*"
# Core's one use glues the test glob behind a star (`*{{.TestGlob}}`), so the value
# is itself a glob tail that covers both `.test.ts` and `.test.tsx`; the includes
# spell the two forms out wherever a reader, not a shell, is the audience.
test_glob: ".test.ts*"
project_marker: package.json
# The most common form; the includes also name `// eslint-disable-line`, the block
# form `/* eslint-disable <rule> */`, `@ts-expect-error` and `@ts-ignore`, which are
# suppressions of the same kind.
nolint: "// eslint-disable-next-line"
comment_prefix: "//"
# Fallbacks when the repository's package.json scripts, Taskfile or Makefile do not
# name the commands, in the npm spelling: a scalar is one command, so the pre-flight
# and the analyze command tell the agent to swap `npx` for the detected package
# manager's executor (`yarn`, `pnpm exec`, `bunx`) — `npx` cannot resolve a Yarn
# Plug'n'Play repository's binaries. The fix fallback type-checks first: ESLint's
# `--fix` and Prettier never see a type error.
default_test: npx vitest run
default_lint: npx tsc --noEmit && npx eslint .
default_lint_fix: npx tsc --noEmit && npx eslint . --fix && npx prettier --write .
# Single words core prose uses as common nouns: the missing value (`undefined` is the
# declared absence; `null` is the wire's and stops at the boundary), a unit of
# concurrent work (a promise, an effect, a timer or a subscription — one thread, so
# the hazards are ordering and leaks, never a data race), the documentation comment
# form, the source-file suffix (`.ts` for modules; components are `.tsx`) and the
# visibility of a non-public symbol (a module's non-exported declaration; the value
# starts with a vowel so "an {{.Unexported}} symbol" reads — and it is `internal`,
# not the literal word "unexported", because that word is a residue token the
# handbook gate rejects, as the generic binding found).
nil: undefined
task: async task
doc_form: JSDoc
doc_comment: JSDoc comment
src_ext: .ts
unexported: internal
# The standalone coding-rules document rendered from core/handbook/ with this
# binding's files under handbook/, written outside the plugin directory.
handbook: coding-rules/ts-react.md
# Paths in the plugin directory the generator does not own. An eval run copies its
# cases under evals/ at run time.
ignore:
  - evals/*
  - .DS_Store
