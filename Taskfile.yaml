version: '3'

# The plugin directories are generated: edit core/ and lang/<binding>/, then run
# `task generate` (Go), `task generate BINDING=generic` and `task generate
# BINDING=python`, and commit all three. CI runs
# `task check`, `task lint-core`, `task docs:check` and `task test-gate`, plus the
# generator's tests and linter.

tasks:
  generate:
    desc: Render core/ + lang/<BINDING>/ into its plugin directory and, when the profile names one, its coding-rules handbook (BINDING=go; generic renders linter-driven-development/, python renders python-linter-driven-development/)
    dir: tools/ldd-gen
    vars:
      BINDING: '{{.BINDING | default "go"}}'
    cmds:
      - go run . -root {{.ROOT_DIR}} -lang {{.BINDING}}

  check:
    desc: Fail when any plugin directory or coding-rules handbook on disk differs from its rendering
    dir: tools/ldd-gen
    cmds:
      - go run . -root {{.ROOT_DIR}} -check

  lint-core:
    desc: Report language residue in core/, refresh the Residue section of core/README.md, fail on hard hits or a stale section
    dir: tools/ldd-gen
    cmds:
      - go run . lint-core -root {{.ROOT_DIR}} -write
      - |
        git -C {{.ROOT_DIR}} diff --exit-code -- core/README.md \
          || { echo "lint-core - the Residue section of core/README.md was rewritten; commit it"; exit 1; }

  test-gate:
    desc: Run the fixture matrices of the generated scripts — the repo-brain gate, the review's detection pass, the refactoring skill's slicing step and the move implementer's verification bound — for every plugin
    cmds:
      - bash go-linter-driven-development/scripts/check-repo-brain_test.sh
      - bash linter-driven-development/scripts/check-repo-brain_test.sh
      - bash python-linter-driven-development/scripts/check-repo-brain_test.sh
      - bash go-linter-driven-development/scripts/ldd-detect_test.sh
      - bash linter-driven-development/scripts/ldd-detect_test.sh
      - bash python-linter-driven-development/scripts/ldd-detect_test.sh
      - bash go-linter-driven-development/scripts/ldd-slices_test.sh
      - bash linter-driven-development/scripts/ldd-slices_test.sh
      - bash python-linter-driven-development/scripts/ldd-slices_test.sh
      - bash go-linter-driven-development/scripts/ldd-attempt_test.sh
      - bash linter-driven-development/scripts/ldd-attempt_test.sh
      - bash python-linter-driven-development/scripts/ldd-attempt_test.sh

  test-gen:
    desc: Unit tests and lint for the generator
    dir: tools/ldd-gen
    cmds:
      - go test ./...
      - golangci-lint run

  test-scripts:
    desc: Unit tests for the repository's own scripts (the spend report, the trace check)
    cmds:
      - python3 scripts/spend-report_test.py
      - python3 scripts/parent-edits_test.py

  docs:check:
    desc: Run the repo-brain documentation gate over this repository (pass --fix after --)
    cmds:
      - bash scripts/check-docs.sh {{.CLI_ARGS}}

  evals:run:
    desc: "Run the behavioral evals from buzzdan/ldd-evals against this checkout. Spends money. Vars after --: TIER= CAP= CASE="
    cmds:
      - bash scripts/evals.sh {{.CLI_ARGS}}
