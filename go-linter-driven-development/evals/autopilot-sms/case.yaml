schema_version: "1.1"
context:
  scaffold_script: ./scaffold.sh
postcheck: ./postcheck.sh
tier: expensive
notes: |
  Autopilot over go-mini with the SMS-channel spec. The scaffold amends SPEC.md
  into the base commit; prompt.md's append_system_prompt pre-approves the design
  plan, option questions and commits because autopilot has no non-interactive
  mode. Graders are deterministic except the ship-summary judge; the end-state
  checks that need a command (build/test/lint, GET /channels, git history,
  when-in-Rome) live in postcheck.sh. See README.md for cost and caveats.
