version: '3'

tasks:
  build:
    desc: Compile every package and the svc binary
    cmds:
      - go build ./...
      - go build -o bin/svc ./cmd/svc

  test:
    desc: Run the unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run the unit tests under the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lintwithfix:
    desc: Run golangci-lint and apply automatic fixes
    cmds:
      - golangci-lint run --fix ./...
