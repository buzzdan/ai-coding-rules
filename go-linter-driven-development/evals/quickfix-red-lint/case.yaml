schema_version: "1.1"
context:
  scaffold_script: ../scaffold/red-lint.sh
postcheck: ./postcheck.sh
tier: medium
notes: |
  Every //nolint directive stripped → 51 lint findings. The lint-fixer must FIX
  the mechanical class (errcheck, wrapcheck, goconst on "application/json",
  misspell, early-return) and ESCALATE the design class with a rule route
  (gocognit → R3, gochecknoglobals → R8, …), never re-suppress, never touch
  .golangci.yaml, never weaken a test assertion.
